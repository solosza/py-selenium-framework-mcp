[pytest]
# Pytest configuration for agent tests
# Separate from framework tests (DD-VA-13)

# Marker definitions
markers =
    unit: Fast unit tests (no external dependencies)
    integration: Tests requiring external services

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Console output with HTML reports and coverage
addopts = -v --tb=short
    --cov=agents
    --cov-report=term-missing
    --cov-report=html:agents/tests/_reports/coverage
    --html=agents/tests/_reports/report.html
    --self-contained-html

# Async mode for async tests
asyncio_mode = auto

# Ignore directories
norecursedirs = _reports __pycache__
